name: Worldgen safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worldgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Epsilon Beta reference
        run: git fetch origin epsilon-beta:refs/remotes/origin/epsilon-beta
      - name: Check generator invariants
        run: node scripts/check-worldgen.mjs
      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/worldgen-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          for seed in release-smoke-0 release-smoke-2 release-smoke-4 release-smoke-9 1ni2yqm; do
            out="/tmp/worldgen-${seed}.html"
            log="/tmp/worldgen-${seed}.log"
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:8000/?seed=${seed}" >"$out" 2>"$log"
            rendered_frames="$(grep -o 'data-rendered-frames="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            if [[ -z "$rendered_frames" || "$rendered_frames" -lt 1 ]]; then
              echo "Browser rendered no completed frame for ${seed}"
              grep -o 'data-frame-stage="[^"]*"' "$out" | head -1 || true
              grep -o 'data-runtime-error="[^"]*"' "$out" | head -1 || true
              cat "$log"
              exit 1
            fi
            if ! grep -Fq "Мир ${seed} · бескрайний" "$out"; then
              echo "Browser smoke test did not finish generation for ${seed}"
              grep -o 'data-runtime-error="[^"]*"' "$out" | head -1 || true
              grep -o 'data-generation-stage="[^"]*"' "$out" | head -1 || true
              grep -o 'id="name">[^<]*' "$out" | head -1 || true
              cat "$log"
              exit 1
            fi
            if grep -Fq 'id="name">Создание мира</h1>' "$out"; then
              echo "World title remained in loading state for ${seed}"
              cat "$log"
              exit 1
            fi
            grass="$(grep -o 'data-grass-instances="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            cover="$(grep -o 'data-grass-cover="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ -z "$grass" || -z "$cover" ]]; then
              echo "Grass diagnostics were not emitted for ${seed}"
              exit 1
            fi
            if [[ "$seed" == "release-smoke-2" && "$grass" -le 0 ]]; then
              echo "Dense grass smoke seed generated no visible grass"
              exit 1
            fi
            fog_near="$(grep -o 'data-fog-near="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            fog_far="$(grep -o 'data-fog-far="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            fog_moisture="$(grep -o 'data-fog-moisture="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ -z "$fog_near" || -z "$fog_far" || -z "$fog_moisture" ]]; then
              echo "Fog diagnostics were not emitted for ${seed}"
              exit 1
            fi
            if grep -Eiq 'THREE\.WebGLProgram: Shader Error|VALIDATE_STATUS false|ERROR: [0-9]+:' "$log"; then
              echo "WebGL shader failure detected for ${seed}"
              cat "$log"
              exit 1
            fi
          done
