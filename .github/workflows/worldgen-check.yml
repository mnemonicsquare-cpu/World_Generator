name: Worldgen safety checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  worldgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Epsilon Beta reference
        run: git fetch origin epsilon-beta:refs/remotes/origin/epsilon-beta
      - name: Check generator invariants
        run: node scripts/check-worldgen.mjs
      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/worldgen-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          chrome="$(command -v google-chrome || command -v google-chrome-stable)"
          for seed in release-smoke-0 release-smoke-2 release-smoke-4 release-smoke-9 1ni2yqm; do
            out="/tmp/worldgen-${seed}.html"
            log="/tmp/worldgen-${seed}.log"
            "$chrome" --headless=new --no-sandbox --disable-dev-shm-usage --use-gl=swiftshader --enable-unsafe-swiftshader --virtual-time-budget=12000 --dump-dom "http://127.0.0.1:8000/?seed=${seed}&smoke=1" >"$out" 2>"$log"
            rendered_frames="$(grep -o 'data-rendered-frames="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            frame_contrast="$(grep -o 'data-frame-contrast="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            if [[ -z "$rendered_frames" || "$rendered_frames" -lt 1 ]]; then
              echo "Browser rendered no completed frame for ${seed}"
              grep -o 'data-update-error="[^"]*"' "$out" | head -1 || true
              grep -o 'data-runtime-error="[^"]*"' "$out" | head -1 || true
              cat "$log"
              exit 1
            fi
            if [[ -z "$frame_contrast" || "$frame_contrast" -lt 4 ]]; then
              echo "Rendered canvas is blank or effectively uniform for ${seed}: contrast=${frame_contrast:-missing}"
              cat "$log"
              exit 1
            fi
            if ! grep -Fq "Мир ${seed} · бескрайний" "$out"; then
              echo "Browser smoke test did not finish generation for ${seed}"
              grep -o 'data-runtime-error="[^"]*"' "$out" | head -1 || true
              grep -o 'data-generation-stage="[^"]*"' "$out" | head -1 || true
              grep -o 'id="name">[^<]*' "$out" | head -1 || true
              cat "$log"
              exit 1
            fi
            if grep -Fq 'id="name">Создание мира</h1>' "$out"; then
              echo "World title remained in loading state for ${seed}"
              cat "$log"
              exit 1
            fi
            grass="$(grep -o 'data-grass-instances="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            cover="$(grep -o 'data-grass-cover="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ -z "$grass" || -z "$cover" ]]; then
              echo "Grass diagnostics were not emitted for ${seed}"
              exit 1
            fi
            if [[ "$seed" == "release-smoke-2" && "$grass" -le 0 ]]; then
              echo "Dense grass smoke seed generated no visible grass"
              exit 1
            fi
            road_segments="$(grep -o 'data-road-segments="[0-9]*"' "$out" | head -1 | grep -o '[0-9]*' || true)"
            road_grade="$(grep -o 'data-road-max-grade="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            road_range="$(grep -o 'data-road-lateral-range="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            road_radius="$(grep -o 'data-road-min-radius="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            road_far_grade="$(grep -o 'data-road-far-grade="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            road_far_ok="$(grep -o 'data-road-far-ok="[01]"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ -z "$road_segments" || "$road_segments" -le 0 || -z "$road_grade" || -z "$road_range" || -z "$road_radius" || -z "$road_far_grade" || "$road_far_ok" != "1" ]]; then
              echo "Infinite-road diagnostics were not emitted or no valid cross-world road was generated for ${seed}"
              exit 1
            fi
            awk -v g="$road_grade" 'BEGIN{if(g>0.10)exit 1}' || { echo "Road grade too steep for ${seed}: $road_grade"; exit 1; }
            awk -v g="$road_far_grade" 'BEGIN{if(g>0.10)exit 1}' || { echo "Cross-world road grade too steep for ${seed}: $road_far_grade"; exit 1; }
            awk -v r="$road_range" 'BEGIN{if(r<120)exit 1}' || { echo "Road is too straight for ${seed}: lateral range=$road_range"; exit 1; }
            awk -v r="$road_radius" 'BEGIN{if(r<32)exit 1}' || { echo "Road turn radius too tight for ${seed}: $road_radius m"; exit 1; }
            car_ready="$(grep -o 'data-car-ready="[01]"' "$out" | head -1 | cut -d'"' -f2 || true)"
            car_road_distance="$(grep -o 'data-car-road-distance="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            car_moved="$(grep -o 'data-car-smoke-moved="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            car_camera_gap="$(grep -o 'data-car-camera-gap="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            car_finite="$(grep -o 'data-car-finite="[01]"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ "$car_ready" != "1" || "$car_finite" != "1" || -z "$car_road_distance" || -z "$car_moved" || -z "$car_camera_gap" ]]; then
              echo "Road-car diagnostics were not emitted or are invalid for ${seed}"
              grep -o 'data-car-[a-z-]*="[^"]*"' "$out" | head -10 || true
              exit 1
            fi
            awk -v d="$car_road_distance" 'BEGIN{if(d>4.8)exit 1}' || { echo "Car did not spawn on the road for ${seed}: distance=$car_road_distance"; exit 1; }
            awk -v m="$car_moved" 'BEGIN{if(m<0.5)exit 1}' || { echo "Car smoke drive did not move for ${seed}: moved=$car_moved"; exit 1; }
            awk -v g="$car_camera_gap" 'BEGIN{if(g<0.4||g>20)exit 1}' || { echo "Third-person car camera geometry is invalid for ${seed}: gap=$car_camera_gap"; exit 1; }
            fog_near="$(grep -o 'data-fog-near="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            fog_far="$(grep -o 'data-fog-far="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            fog_moisture="$(grep -o 'data-fog-moisture="[0-9.]*"' "$out" | head -1 | cut -d'"' -f2 || true)"
            if [[ -z "$fog_near" || -z "$fog_far" || -z "$fog_moisture" ]]; then
              echo "Fog diagnostics were not emitted for ${seed}"
              exit 1
            fi
            if grep -Eiq 'THREE\.WebGLProgram: Shader Error|VALIDATE_STATUS false|ERROR: [0-9]+:' "$log"; then
              echo "WebGL shader failure detected for ${seed}"
              cat "$log"
              exit 1
            fi
          done
