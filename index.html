function clear(){if(!scene)return;let gs=new Set,ms=new Set;scene.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>ms.add(m))});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose())}

function ruin(x,z,type,stone,accent){let a=rnd()*6.28,box=new T.BoxGeometry(1,1,1),column=new T.CylinderGeometry(.8,1,1,7);function p(px,pz,w,h,d,g=box,up=0){let X=x+Math.cos(a)*px-Math.sin(a)*pz,Z=z+Math.sin(a)*px+Math.cos(a)*pz,o=mesh(g,stone,X,ground(X,Z)+h/2+up,Z,w,h,d);o.rotation.y=a}
if(type===0){for(let j=-2;j<=2;j++)for(const side of[-1,1])if(rnd()>.25)p(side*5,j*4,1,5+rnd()*5,1,column);p(0,-9,11,.7,1)}
else if(type===1)for(let l=0;l<4;l++){let w=11-l*1.5;for(let s=0;s<4;s++)if(rnd()>.16*l){let A=s*Math.PI/2;p(Math.cos(A)*w/2,Math.sin(A)*w/2,s%2?w:1.1,2.6,s%2?1.1:w,box,l*2.6)}}

function makeWeather(type,c){let n=type==="rain"?1000:650,a=new Float32Array(n*3),speed=new Float32Array(n);for(let i=0;i<n;i++){a[i*3]=(rnd()-.5)*100;a[i*3+1]=rnd()*65-20;a[i*3+2]=(rnd()-.5)*100;speed[i]=.6+rnd()*.9}let g=new T.BufferGeometry;g.setAttribute("position",new T.BufferAttribute(a,3));let m=new T.PointsMaterial({color:c,size:type==="rain"?.07:type==="spores"?.16:.2,transparent:true,opacity:0,depthWrite:false,blending:type==="spores"?T.AdditiveBlending:T.NormalBlending}),points=new T.Points(g,m);points.frustumCulled=false;scene.add(points);return{type,points,a,speed,phase:rnd()*6.28,strength:.3+rnd()*.7}}

function makeNightSky(){
  // Independent random stream preserves terrain and vegetation for existing seeds.
  const r=rng(G.hash^0x73a91);
  const group=new T.Group();scene.add(group);
  const skyGeo=new T.SphereGeometry(1080,32,20),skyColors=new Float32Array(skyGeo.attributes.position.count*3);
  skyGeo.setAttribute("color",new T.BufferAttribute(skyColors,3));
  const dome=new T.Mesh(skyGeo,new T.MeshBasicMaterial({vertexColors:true,side:T.BackSide,depthWrite:false,fog:false}));
  dome.renderOrder=-10;group.add(dome);
  const moons=[];
  const count=1+Math.floor(r()*3);
  for(let i=0;i<count;i++){
    const radius=i===0?27+r()*17:10+r()*16;
    const geo=new T.SphereGeometry(radius,32,24),p=geo.attributes.position,colors=[];
    const base=col(G.hue+.04+i*.035,.12,.79);
    const craters=Array.from({length:12},()=>{const v=new T.Vector3(r()-.5,r()-.5,r()-.5).normalize();return {v,size:.025+r()*.06};});
    const normal=new T.Vector3();
    for(let j=0;j<p.count;j++){
      normal.fromBufferAttribute(p,j).normalize();
      let shade=.86+.09*Math.sin(normal.x*19+normal.z*7)*Math.sin(normal.y*23);
      for(const crater of craters){const d=1-normal.dot(crater.v);shade-=.14*Math.exp(-d/crater.size);}
      const tint=base.clone().multiplyScalar(clamp(shade,.55,1));
      colors.push(tint.r,tint.g,tint.b);
    }
    geo.setAttribute("color",new T.Float32BufferAttribute(colors,3));
    const material=new T.MeshBasicMaterial({vertexColors:true,fog:false});
    const body=new T.Mesh(geo,material);
    const azimuth=-Math.PI/2+(i-(count-1)/2)*.65+(r()-.5)*.2;
    const elevation=.36+r()*.55;
    body.position.set(Math.cos(azimuth)*Math.cos(elevation)*770,Math.sin(elevation)*770,Math.sin(azimuth)*Math.cos(elevation)*770);
    group.add(body);moons.push(body);
  }
  const stars=[];
  for(let layer=0;layer<2;layer++){
    const positions=[],colors=[],n=layer===0?1700:160;
    for(let i=0;i<n;i++){
      const y=.04+r()*.96,az=r()*Math.PI*2,h=Math.sqrt(1-y*y);
      positions.push(Math.cos(az)*h*970,y*970,Math.sin(az)*h*970);

      colors.push(tint.r,tint.g,tint.b);

    geo.setAttribute("color",new T.Float32BufferAttribute(colors,3));

  }

  moonlight.position.copy(moons[0].position);scene.add(moonlight);
  const ambient=new T.AmbientLight(col(G.hue,.08,.72),0);scene.add(ambient);
  return {group,dome,moons,stars,moonlight,ambient};
}
function updateNightSky(e,day,front,top,horizon){
  const sky=e.nightSky;
  sky.group.position.copy(cam.position);
  const night=1-day;
  sky.moonlight.intensity=night*1.35*(1-front*.25);
  sky.ambient.intensity=night*.32;
  for(const moon of sky.moons)moon.material.color.setScalar(.7+night*.55);
  sky.stars.forEach((stars,i)=>{stars.material.opacity=night*night*(1-front*.65)*(i?.92:.65);});
  const p=sky.dome.geometry.attributes.position,a=sky.dome.geometry.attributes.color;
  const tint=new T.Color();
  for(let i=0;i<p.count;i++){
    const t=Math.pow(clamp(p.getY(i)/1080,0,1),.55);
    tint.copy(horizon).lerp(top,t);a.setXYZ(i,tint.r,tint.g,tint.b);

let homes=[],buildingSolids=[];
function planHomes(){
  const r=rng(G.hash^0x814af);homes=[];
  const count=r()<.3?0:r()<.85?1:2;
  for(let i=0;i<count;i++){
    const type=Math.floor(r()*5),z=80-i*220,x=G.path+(i?-85:75);
    const basement=type===2||r()<.3;
    const floors=type===4?3+Math.floor(r()*3):type===2?1:1+Math.floor(r()*3);
    const cells=[];
    for(let iz=-1;iz<=1;iz++)for(let ix=-1;ix<=1;ix++){
      if(type===4&&ix!==0)continue;
      if(type===1&&ix===1&&iz!==1)continue;
      if(type===0&&ix===-1&&iz===-1)continue;
      cells.push([ix,iz]);
    }
    if(type===3)for(let iz=-1;iz<=1;iz++)cells.push([2,iz]);
    homes.push({x,z,base:Math.max(height(x,z),G.water+(basement?7:2))+.25,
      seed:Math.floor(r()*4294967295),type,basement,floors,cells,roof:Math.floor(r()*3)});
  }
}
function houseReserved(x,z){
  return homes.some(h=>Math.abs(x-h.x)<34&&Math.abs(z-h.z)<30);
}
function buildHomes(){
  buildingSolids=[];
  for(const house of homes){
    const r=rng(house.seed),{x,z,base,cells}=house,box=new T.BoxGeometry(1,1,1);
    const wall=mat(col(G.hue+(r()-.5)*.16,.1+r()*.2,.32+r()*.3));

    const floorMat=mat(col(G.hue+.06,.15,.36+r()*.16));
    const paints=Array.from({length:5},()=>mat(col(G.hue+(r()-.5)*.24,.1+r()*.2,.4+r()*.2)));
    function part(px,py,pz,w,h,d,m=wall,solid=true){
      mesh(box,m,x+px,base+py,z+pz,w,h,d);
      if(solid)buildingSolids.push({x:x+px,z:z+pz,y:base+py,w:w/2,d:d/2,h:h/2});
    }
    const exists=(ix,iz)=>cells.some(c=>c[0]===ix&&c[1]===iz);
    const key=(a,b)=>[a,b].sort().join("|");
    const start=house.basement?-1:0;
    house.roomCount=0;
    for(let level=start;level<house.floors;level++){
      const b=level*4.2,edges=new Set(),visited=new Set(["0,1"]),stack=[[0,1]];

      while(stack.length){
        const [ix,iz]=stack[stack.length-1];
        const choices=[[ix+1,iz],[ix-1,iz],[ix,iz+1],[ix,iz-1]].filter(([u,v])=>exists(u,v)&&!visited.has(u+","+v));
        if(!choices.length){stack.pop();continue;}
        const next=choices[Math.floor(r()*choices.length)];
        edges.add(key(ix+","+iz,next.join(",")));visited.add(next.join(","));stack.push(next);
      }
      // The full-height stair core always connects its three cells.
      edges.add(key("0,-1","0,0"));edges.add(key("0,0","0,1"));
      for(const [ix,iz] of cells){
        const cx=ix*8,cz=iz*8,paint=paints[Math.floor(r()*paints.length)];
        if(ix!==0)house.roomCount++;
        if(level===start||ix!==0)part(cx,b-.15,cz,8,.3,8,floorMat);
        else{
          // Open stair flight from -8 to +6, with side galleries.
          part(-2.85,b-.15,cz,2.3,.3,8,floorMat);
          part(2.85,b-.15,cz,2.3,.3,8,floorMat);
          if(iz===-1)part(0,b-.15,-10,3.4,.3,4,floorMat);
          if(iz===1)part(0,b-.15,9,3.4,.3,6,floorMat);
        }
        for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const neighbor=exists(ix+dx,iz+dz);
          if(neighbor&&(dx<0||dz<0))continue;
          if(ix===0&&dx===0&&neighbor)continue;
          const door=(neighbor&&edges.has(key(ix+","+iz,(ix+dx)+","+(iz+dz))))||
            (!neighbor&&level===0&&ix===0&&iz===1&&dz===1);
          const wx=cx+dx*4,wz=cz+dz*4;
          const window=!neighbor&&!door&&level>=0&&house.type!==2&&r()<.65;
          const material=neighbor?paint:wall;
          function seg(offset,len,yy,hh){part(wx+(dz?offset:0),b+yy,wz+(dx?offset:0),dz?len:.32,hh,dx?len:.32,material);}
          if(door||window){
            seg(-2.6,2.8,1.95,3.9);seg(2.6,2.8,1.95,3.9);
            seg(0,2.4,3.4,1);
            if(window)seg(0,2.4,.65,1.3);
          }else seg(0,8,1.95,3.9);
        }
      }
      if(level<house.floors-1){
        for(let i=0;i<28;i++){const top=(i+1)*.15;part(0,b+top-.09,-8+(i+.5)*.5,2.6,.18,.5,trim);}
      }
      if(level>start)for(const side of [-1,1])part(side*1.8,b+.5,-1,.12,1,14,trim);
      // Restrict expensive point lights to two per building.
      if(level===0||level===start){
        const lamp=new T.PointLight(col(.11,.22,.8),25,23,2);lamp.position.set(x,base+b+3.3,z+9);scene.add(lamp);
      }
      part(0,b+3.4,9,.5,.18,.5,mat(col(.11,.2,.7),1),false);
    }
    for(const [ix,iz] of cells){
      const top=house.floors*4.2;
      part(ix*8,top,iz*8,8.5,.4,8.5,trim);
      if(house.roof===1){
        const roof=mesh(new T.ConeGeometry(6,3,4),trim,x+ix*8,base+top+1.7,z+iz*8);
        roof.rotation.y=Math.PI/4;
      }else if(house.roof===2){
        part(ix*8,top+.5,iz*8,7.7,.7,7.7,wall,false);
      }
    }
    part(0,-.12,14,3.5,.24,4,floorMat);
  }
}
function supportAt(x,z,feet){
  let top=Math.max(ground(x,z),G.water);for(const home of homes)if(home.cells.some(([ix,iz])=>Math.abs(x-home.x-ix*8)<4&&Math.abs(z-home.z-iz*8)<4))top=home.base-(home.basement?4.2:0);
  for(const b of buildingSolids){
    const y=b.y+b.h;
    if(Math.abs(x-b.x)<b.w&&Math.abs(z-b.z)<b.d&&y<=feet+.23&&y>top)top=y;
  }
  return top;
}
function bodyBlocked(x,z,feet){
  return buildingSolids.some(b=>
    Math.abs(x-b.x)<b.w+.28&&Math.abs(z-b.z)<b.d+.28&&
    b.y+b.h>feet+.24&&b.y-b.h<feet+1.7);
}
function walkFrame(dt,dx,dz){
  let feet=cam.position.y-1.75;
  for(const axis of ["x","z"]){
    const x=clamp(cam.position.x+(axis==="x"?dx:0),-395,395);
    const z=clamp(cam.position.z+(axis==="z"?dz:0),-395,395);
    const old=supportAt(cam.position.x,cam.position.z,feet);
    const next=supportAt(x,z,feet);
    if(next-old<=Math.max(.23,Math.hypot(dx,dz)*1.25)&&!bodyBlocked(x,z,Math.max(feet,next))){
      cam.position.x=x;cam.position.z=z;
      if(grounded&&next>feet){feet=next;cam.position.y=feet+1.75;}
    }
  }
  jump-=15*dt;
  let target=cam.position.y+jump*dt;
  if(jump>0&&bodyBlocked(cam.position.x,cam.position.z,target-1.75)){target=cam.position.y;jump=0;}
  const floor=supportAt(cam.position.x,cam.position.z,cam.position.y-1.75)+1.75;
  if(target<=floor){cam.position.y=floor;jump=0;grounded=true;}
  else{cam.position.y=target;grounded=false;}
}

const soundTracks=new Map();
const bundledSounds={
  wind:"51366__samsmyname__wind.wav",
  rain:"337791__miradeshazer__city-pouring-rain.wav",
  gravel:"528953__fthgurdy__walking-on-sand-and-gravel-2.wav",
  snow:"842553__hyperfoley__snow-walking-4.wav"
};
let lastAudioX=0,lastAudioZ=0,audioLoading;

function audioStore(){
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open("other-worlds-audio",1);
    request.onupgradeneeded=()=>request.result.createObjectStore("tracks");
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
}
async function cacheTrack(type,buffer){
  try{const db=await audioStore();db.transaction("tracks","readwrite").objectStore("tracks").put(buffer,type);}
  catch(error){console.warn("Audio cache is unavailable",error);}
}
async function cachedTrack(type){
  try{
    const db=await audioStore();
    return await new Promise((resolve,reject)=>{
      const request=db.transaction("tracks").objectStore("tracks").get(type);
      request.onsuccess=()=>resolve(request.result);
      request.onerror=()=>reject(request.error);
    });
  }catch{return null;}
}
async function installTrack(type,data){
  const buffer=await audio.ctx.decodeAudioData(data.slice(0));
  const previous=soundTracks.get(type);
  if(previous){previous.source.stop();previous.source.disconnect();previous.gain.disconnect();}
  const source=audio.ctx.createBufferSource(),gain=audio.ctx.createGain();
  source.buffer=buffer;source.loop=true;gain.gain.value=0;
  source.connect(gain).connect(audio.ctx.destination);source.start();
  soundTracks.set(type,{source,gain});
}
async function loadBundledSounds(){
  if(audioLoading)return audioLoading;
  audioLoading=(async()=>{
    const status=$("#audioStatus"),missing=[];
    status.textContent=" · звук загружается…";
    for(const [type,url] of Object.entries(bundledSounds)){
      let data=null;
      try{
        const response=await fetch(url);
        if(response.ok)data=await response.arrayBuffer();
      }catch{}
      if(!data)data=await cachedTrack(type);
      if(!data){missing.push(type);continue;}
      try{await installTrack(type,data);}catch{missing.push(type);}
    }
    status.textContent=missing.length?" · можно добавить свои WAV":" · атмосфера готова";
    return soundTracks.size;
  })();
  return audioLoading;
}
async function loadSoundFiles(files){
  if(!audio){await toggleAudio();if(sound)await toggleAudio();}
  const status=$("#audioStatus");let loaded=0;
  for(const file of files){
    const name=file.name.toLowerCase();
    const type=name.includes("rain")?"rain":name.includes("wind")?"wind":name.includes("snow")?"snow":name.includes("sand")||name.includes("gravel")?"gravel":null;
    if(!type)continue;
    try{
      const data=await file.arrayBuffer();
      await installTrack(type,data);
      await cacheTrack(type,data);
      loaded++;
    }catch(error){status.textContent=" · не удалось прочитать "+file.name;return;}
  }
  status.textContent=loaded?" · WAV сохранены в этом браузере":" · подходящие WAV не найдены";
  if(loaded&&!sound)await toggleAudio();
}
function updateSoundscape(dt){
  if(!audio)return;
  const moved=Math.hypot(cam.position.x-lastAudioX,cam.position.z-lastAudioZ);
  lastAudioX=cam.position.x;lastAudioZ=cam.position.z;
  const indoors=homes.some(h=>cam.position.y<h.base+h.floors*4.2&&h.cells.some(([ix,iz])=>Math.abs(cam.position.x-h.x-ix*8)<4&&Math.abs(cam.position.z-h.z-iz*8)<4));
  const front=smooth(.5+.5*Math.sin(celestial.age/55+weather.phase))*weather.strength;
  const walking=grounded&&document.pointerLockElement===rend.domElement&&moved>.001&&moved<2;
  for(const [type,track] of soundTracks){
    let volume=0;
    if(type==="wind")volume=(.1+front*.13)*(indoors?.18:1);
    if(type==="rain"&&weather.type==="rain")volume=(.06+front*.28)*(indoors?.25:1);
    if(type===(weather.type==="snow"?"snow":"gravel")&&walking&&!indoors)volume=keys.has("ShiftLeft")?.36:.27;
    track.gain.gain.setTargetAtTime(sound?volume:0,audio.ctx.currentTime,.14);
    if(type==="snow"||type==="gravel")track.source.playbackRate.setTargetAtTime(keys.has("ShiftLeft")?1.35:1,audio.ctx.currentTime,.2);
  }
  audio.master.gain.setTargetAtTime(sound&&!soundTracks.has("wind")?.18:0,audio.ctx.currentTime,.2);
}

rend.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),f=+keys.has("KeyW")-+keys.has("KeyS"),s=+keys.has("KeyD")-+keys.has("KeyA");
