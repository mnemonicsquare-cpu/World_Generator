  }
  stick.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();stickPointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});
  stick.addEventListener("pointermove",e=>{if(e.pointerId===stickPointer)moveStick(e)});
  stick.addEventListener("pointerup",resetStick);stick.addEventListener("pointercancel",resetStick);
  const stopBoost=e=>{e.preventDefault();e.stopPropagation();mobileBoost=false;boostButton.style.background=""};
  boostButton.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();mobileBoost=true;boostButton.style.background="#587386";boostButton.setPointerCapture(e.pointerId)});
  boostButton.addEventListener("pointerup",stopBoost);boostButton.addEventListener("pointercancel",stopBoost);
  jumpButton.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(grounded){jump=8.2;grounded=false}});
  rend.domElement.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"||e.clientX<innerWidth*.4)return;
    lookPointer=e.pointerId;lastLookX=e.clientX;lastLookY=e.clientY;rend.domElement.setPointerCapture(e.pointerId);
  });
  rend.domElement.addEventListener("pointermove",e=>{
    if(e.pointerId!==lookPointer)return;
    yaw-=(e.clientX-lastLookX)*.0042;pitch=clamp(pitch-(e.clientY-lastLookY)*.0042,-1.45,1.45);
    lastLookX=e.clientX;lastLookY=e.clientY;
  });
  const stopLook=e=>{if(e.pointerId===lookPointer)lookPointer=null};
  rend.domElement.addEventListener("pointerup",stopLook);rend.domElement.addEventListener("pointercancel",stopLook);
}

function fresh(){return crypto.getRandomValues(new Uint32Array(1))[0].toString(36)}
const menuPanel=$("#menuPanel"),menuToggle=$("#menuToggle");

$("#new").onclick=()=>{generate(fresh());toggleMenu(false)};$("#seed").onkeydown=e=>{if(e.key==="Enter"){let s=e.target.value.trim().slice(0,60);if(s)generate(s);toggleMenu(false)}};$("#sound").onclick=async()=>{await toggleAudio();if(sound)await loadBundledSounds();};$("#night").onclick=()=>{const phase=(celestial.start+celestial.age/celestial.length)%1;celestial.start=phase<.5?.75:.25;celestial.age=0;update(0);};$("#photo").onclick=()=>rend.domElement.toBlob(b=>{let u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="world-"+G.hash+".png";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});

addEventListener("resize",resizeView);visualViewport?.addEventListener("resize",resizeView);screen.orientation?.addEventListener("change",()=>setTimeout(resizeView,120));resizeView();generate(new URLSearchParams(location.search).get("seed")||fresh());
rend.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),f=+keys.has("KeyW")-+keys.has("KeyS")+mobileForward,s=+keys.has("KeyD")-+keys.has("KeyA")+mobileSide;
  const n=Math.max(1,Math.hypot(f,s)),spd=boosting()?32:5;
  const dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)/n*spd*dt,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)/n*spd*dt;
  // Substeps keep walls and stair risers solid even during fast movement.
  const steps=Math.max(1,Math.ceil(Math.hypot(dx,dz)/.1));
  for(let i=0;i<steps;i++)walkFrame(dt/steps,dx/steps,dz/steps);
  cam.rotation.set(pitch,yaw,0);cam.fov=mix(cam.fov,boosting()&&Math.hypot(f,s)?79:66,1-Math.exp(-dt*8));cam.updateProjectionMatrix();updateChunks();update(dt);updateSoundscape(dt);rend.render(scene,cam);
});
